<script>
/* Prikaz grešaka na ekranu (korisno na mobitelu gdje nema konzole). */
window.addEventListener('error',function(e){
  var t=e.target,msg,o=location.origin;
  if(t&&t.src&&/config\.js/.test(t.src)&&!e.message) return;
  /* greške tuđih skripti (novčanik/ekstenzija u pregledniku, "Script error.") nisu iz aplikacije */
  if(e.message&&(!e.filename||e.filename.indexOf(o)!==0)) return;
  if(!e.message&&t&&(t.src||t.href)&&String(t.src||t.href).indexOf(o)!==0) return;
  if(t&&(t.src||t.href)&&!e.message) msg='Ne mogu učitati datoteku: '+(t.src||t.href).split('/').pop();
  else msg=(e.message||'Greška')+(e.filename?'  ('+e.filename.split('/').pop()+':'+e.lineno+')':'');
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('pre');b.id='errbox';
    b.style.cssText='position:fixed;z-index:99;left:8px;right:8px;top:64px;background:#b00020;color:#fff;padding:10px 12px;border-radius:10px;font:12px/1.4 monospace;white-space:pre-wrap;max-height:50vh;overflow:auto';
    (document.body||document.documentElement).appendChild(b);}
  b.textContent+=msg+'\n';
},true);
</script>

<body>
<header>
  <h1>Trening</h1>
  <button class="sync" id="syncBtn" title="Sinkroniziraj s Google Driveom"><span class="dot" id="dot"></span><span id="syncTxt">lokalno</span></button>
  <button class="btn pri" id="addBtn">+ Novi</button>
</header>

<main id="view"></main>

<nav id="nav">
  <button data-v="cal" class="on"><b>▤</b>Kalendar</button>
  <button data-v="overview"><b>▦</b>Pregled</button>
  <button data-v="map"><b>◉</b>Karta</button>
  <button data-v="table"><b>☰</b>Tablica</button>
  <button data-v="settings"><b>⚙</b>Postavke</button>

<input type="file" id="oneIn" class="hide">

<script>
'use strict';
/* =====================================================================
   POSTAVKE – ovdje zalijepi svoj Google OAuth Client ID (vidi upute).
   Ako ostane prazno, aplikacija radi lokalno + ručni backup (JSON).
   ===================================================================== */
const GOOGLE_CLIENT_ID = (window.TRENING_CONFIG && window.TRENING_CONFIG.googleClientId) || '';
const DRIVE_FILE_NAME = 'trening-evidencija.json';
const TRACKS_FILE_NAME = 'trening-tragovi.json';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';

/* ---------- lokalna pohrana (IndexedDB, uz localStorage rezervu) ---------- */
const store = {
  _db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no idb'));
      const r = indexedDB.open('trening', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    try {
      if (!this._db) await this.open();
      return await new Promise((res, rej) => { const q = this._db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch (e) { try { return JSON.parse(localStorage.getItem('kv_' + k)); } catch (_) { return undefined; } }
  },
  async set(k, v) {
    try {
      if (!this._db) await this.open();
      await new Promise((res, rej) => { const t = this._db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
    } catch (e) { try { localStorage.setItem('kv_' + k, JSON.stringify(v)); } catch (_) {} }
  },
  async setTrack(id, v) { // trase su prevelike za localStorage: bez rezerve, greška se prijavljuje
    if (!this._db) await this.open();
    await new Promise((res, rej) => { const t = this._db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'tr:' + id); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
  async keys(prefix) {
    try {
      if (!this._db) await this.open();
      return await new Promise((res, rej) => {
        const out = [], q = this._db.transaction('kv').objectStore('kv').openKeyCursor(IDBKeyRange.bound(prefix, prefix + '\uffff'));
        q.onsuccess = () => { const c = q.result; if (c) { out.push(c.key); c.continue(); } else res(out); };
        q.onerror = () => rej(q.error);
      });
    } catch (e) { return []; }
  },
  async del(k) {
    try { if (!this._db) await this.open(); await new Promise((res, rej) => { const t = this._db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {}
  }
};

/* ---------- sinkronizacija s Google Driveom ---------- */
const clientId = () => String(GOOGLE_CLIENT_ID || META.clientId || '').replace(/\s+/g, '');
const idOk = id => /^\d{6,}-[a-z0-9_-]+\.apps\.googleusercontent\.com$/i.test(id);
let token = null, tokenExp = 0, tokenClient = null, syncTimer = null, syncing = false, lastErr = '';

function renderSync() {
  const dot = $('#dot'), txt = $('#syncTxt');
  dot.className = 'dot';
  if (!clientId()) { txt.textContent = 'samo lokalno'; return; }
  if (syncing) { txt.textContent = 'sinkroniziram…'; return; }
  if (lastErr) { dot.classList.add('err'); txt.textContent = 'greška – dodirni'; return; }
  if (META.dirty) { dot.classList.add('dirty'); txt.textContent = 'nije spremljeno na Drive'; return; }
  if (META.lastSync) { dot.classList.add('ok'); txt.textContent = 'Drive ✓ ' + new Date(META.lastSync).toLocaleTimeString('hr', { hour: '2-digit', minute: '2-digit' }); return; }
  txt.textContent = 'dodirni za Drive';
}

function getToken(interactive) {
  return new Promise((resolve, reject) => {
    if (token && Date.now() < tokenExp - 60000) return resolve(token);
    if (!idOk(clientId())) return reject(new Error('Client ID nije u ispravnom obliku (treba biti BROJ-tekst.apps.googleusercontent.com). Vidi Postavke.'));
    if (!window.google || !google.accounts) return reject(new Error('Google skripta nije učitana (nema interneta?).'));
    if (!tokenClient || tokenClient._cid !== clientId()) {
      tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId(), scope: SCOPE, callback: () => {} });
      tokenClient._cid = clientId();
    }
    tokenClient.callback = r => {
      if (r.error) return reject(new Error(r.error_description || r.error));
      token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
      try { sessionStorage.setItem('tok', JSON.stringify({ token, tokenExp })); } catch (_) {}
      resolve(token);
    };
    tokenClient.error_callback = e => reject(new Error(e.type === 'popup_closed' ? 'Prijava prekinuta.' : (e.message || e.type || 'Prijava nije uspjela.')));
    tokenClient.requestAccessToken({ prompt: interactive ? '' : 'none' });
  });
}

async function drive(path, opts = {}, tries = 0) {
  const r = await fetch('https://www.googleapis.com/' + path, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {}) }));
  if (r.status === 401 && tries === 0) { token = null; await getToken(true); return drive(path, opts, 1); }
  if (!r.ok) throw new Error('Drive ' + r.status + ': ' + (await r.text()).slice(0, 160));
  return r;
}

async function findFile() {
  if (META.fileId) return META.fileId;
  const q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
  const r = await (await drive('drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc')).json();
  if (r.files && r.files.length) { META.fileId = r.files[0].id; return META.fileId; }
  return null;
}

async function sync(interactive = false) {
  if (!clientId() || syncing) return;
  syncing = true; lastErr = ''; renderSync();
  try {
    await getToken(interactive);
    let id = await findFile();
    let remote = Core.emptyDB();
    if (id) {
      try { remote = await (await drive('drive/v3/files/' + id + '?alt=media')).json(); }
      catch (e) { if (String(e.message).includes(' 404')) { META.fileId = null; id = null; } else throw e; }
    }
    const merged = Core.mergeDB(DB, remote);
    const changedLocal = !Core.sameDB(merged, DB);
    const changedRemote = !id || !Core.sameDB(merged, remote);
    DB = merged;
    if (changedRemote) {
      const body = JSON.stringify(DB);
      if (id) await drive('upload/drive/v3/files/' + id + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
      else {
        const b = '-----trening' + Date.now();
        const multi = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' }) +
          '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
        const c = await (await drive('upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: multi })).json();
        META.fileId = c.id;
      }
    }
    META.dirty = false; META.lastSync = Date.now();
    await persist(false);
    const pulled = await syncTracks();
    if (changedLocal || pulled) render();
    if (interactive) toast(changedLocal ? 'Sinkronizirano – stigle su promjene s drugog uređaja.' : 'Sinkronizirano.');
  } catch (e) {
    lastErr = e.message || String(e);
    if (interactive) toast(lastErr.slice(0, 140), 4500);
  } finally { syncing = false; renderSync(); }
}
async function findByName(name) {
  const q = encodeURIComponent("name='" + name + "' and trashed=false");
  const r = await (await drive('drive/v3/files?q=' + q + '&spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc')).json();
  return r.files && r.files.length ? r.files[0].id : null;
}
async function upsertDriveJson(fileId, name, body) {
  if (fileId) return (await drive('upload/drive/v3/files/' + fileId + '?uploadType=media&fields=id,version', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body })).json();
  const b = '-----trening' + Date.now();
  const multi = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify({ name, mimeType: 'application/json' }) + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
  return (await drive('upload/drive/v3/files?uploadType=multipart&fields=id,version', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: multi })).json();
}
// Trase (rute, visine, brzine) su u zasebnoj datoteci na Driveu; spajaju se unijom po ID-u treninga.
async function syncTracks(retry = true) {
  const live = new Set(Object.keys(DB.activities));
  let localIds = (await store.keys('tr:')).map(k => k.slice(3));
  for (const id of localIds) if (!live.has(id)) await store.del('tr:' + id); // trase obrisanih treninga
  localIds = localIds.filter(id => live.has(id));
  let fid = META.tracksFileId || await findByName(TRACKS_FILE_NAME);
  if (!fid) {
    if (!localIds.length) return false;
    const all = {}; for (const id of localIds) all[id] = await store.get('tr:' + id);
    const r = await upsertDriveJson(null, TRACKS_FILE_NAME, JSON.stringify({ v: 1, tracks: all }));
    META.tracksFileId = r.id; META.tracksVer = r.version; META.tracksDirty = false; await persist(false);
    return false;
  }
  let info;
  try { info = await (await drive('drive/v3/files/' + fid + '?fields=version,trashed')).json(); }
  catch (e) { if (retry && String(e.message).includes(' 404')) { META.tracksFileId = null; META.tracksVer = null; return syncTracks(false); } throw e; }
  if (String(info.version) === String(META.tracksVer) && !META.tracksDirty && META.tracksFileId === fid) return false; // ništa novo
  const remote = (await (await drive('drive/v3/files/' + fid + '?alt=media')).json()).tracks || {};
  const have = new Set(localIds); let pulled = 0;
  for (const id of Object.keys(remote)) if (live.has(id) && !have.has(id)) { await store.setTrack(id, remote[id]); have.add(id); pulled++; }
  const needPush = localIds.some(id => !(id in remote)) || Object.keys(remote).some(id => !live.has(id));
  if (needPush) {
    const all = {}; for (const id of have) all[id] = id in remote ? remote[id] : await store.get('tr:' + id);
    const r = await upsertDriveJson(fid, TRACKS_FILE_NAME, JSON.stringify({ v: 1, tracks: all }));
    META.tracksVer = r.version;
  } else META.tracksVer = info.version;
  META.tracksFileId = fid; META.tracksDirty = false; await persist(false);
  return pulled > 0;
}
function scheduleSync() {
  clearTimeout(syncTimer);
  if (!clientId() || !token || Date.now() >= tokenExp - 60000) return; // bez valjane prijave čeka dodir na gumb
  syncTimer = setTimeout(() => sync(false), 2500);
}
$('#syncBtn').onclick = () => {

  sync(true);

function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
const fmtKm = v => (v >= 100 ? v.toFixed(0) : v.toFixed(1)).replace('.', ',');
const fmtDate = iso => new Date(iso).toLocaleDateString('hr', { weekday: 'short', day: 'numeric', month: 'numeric', year: 'numeric' });
const fmtTime = iso => new Date(iso).toLocaleTimeString('hr', { hour: '2-digit', minute: '2-digit' });
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type })); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* Što Pregled pokazuje po sportu: kartice sa zbrojevima i početni graf. Postavke se čuvaju u settings.ov (ključ 'all' ili tip sporta). */
const OV_STATS = [['n', 'Broj treninga'], ['time', 'Ukupno vrijeme'], ['km', 'Prijeđeno (km)'], ['elev', 'Visinska razlika'], ['spd', 'Prosječna brzina'], ['pace', 'Prosječni tempo'], ['hr', 'Prosječni puls'], ['cal', 'Kalorije']];
const OV_DEF = ['n', 'time', 'km', 'elev', 'spd', 'cal'];
function ovCfg(sport) {
  const o = DB.settings && DB.settings.ov && DB.settings.ov[sport];
  const st = o && Array.isArray(o.stats) ? OV_STATS.map(x => x[0]).filter(k => o.stats.includes(k)) : OV_DEF;
  return { stats: st, metric: o && ['km', 'h', 'n'].includes(o.metric) ? o.metric : 'km', custom: !!o };
}
async function ovSave(sport, fn) {
  const cur = ovCfg(sport), n = { stats: cur.stats.slice(), metric: cur.metric }; fn(n);
  const ov = Object.assign({}, DB.settings && DB.settings.ov); ov[sport] = n;
  DB.settings = Object.assign({}, DB.settings, { updated: Date.now(), ov }); UI.metricFor = null; await persist(); render();
}
function viewOverview() {
  if (!acts().length) return emptyState();
  if (UI.q.trim()) return viewList();
  const all = filtered();
  const range = Core.periodRange(UI.period, UI.cursor);
  const list = all.filter(a => Core.inRange(a, range));
  const t = Core.totals(list);
  const hasKm = all.some(a => a.dist > 0);
  const hasElev = all.some(a => a.elev > 0);
  if (UI.metricFor !== UI.sport) { UI.metricFor = UI.sport; UI.metric = ovCfg(UI.sport).metric; }
  const bks = Core.buckets(UI.period, UI.cursor, all);
  let metric = UI.metric; if (metric === 'km' && !hasKm) metric = 'h';
  const vals = Core.bucketValues(bks, all, metric);
  const unit = metric === 'km' ? 'km' : metric === 'h' ? 'h' : '×';

  const stat = (v, l, u) => '<div class="stat"><div class="v">' + v + (u ? '<small>' + u + '</small>' : '') + '</div><div class="l">' + l + '</div></div>';
  let html = '<input id="q" type="search" placeholder="Traži treninge po nazivu, opisu, bilješci, oznaci…" value="">' + '<div class="chips"><button class="chip" data-go="records">★ Rekordi</button></div>' + filterBar();
  html += '<div class="seg">' + [['week', 'Tjedan'], ['month', 'Mjesec'], ['year', 'Godina'], ['all', 'Sve']].map(([k, l]) => '<button data-period="' + k + '" class="' + (UI.period === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
  html += '<div class="pager"><button data-page="-1" ' + (UI.period === 'all' ? 'disabled style="visibility:hidden"' : '') + '>‹</button><div class="t">' + esc(periodTitle()) + '</div><button data-page="1" ' + (UI.period === 'all' ? 'disabled style="visibility:hidden"' : '') + '>›</button></div>';
  const moving = Core.totals(list.filter(a => a.dist > 0)), hrs = list.filter(a => a.avgHr > 0);
  const cards = {
    n: stat(t.n, 'treninga'), time: stat(hoursStr(t.sec), 'ukupno vrijeme'),
    km: hasKm ? stat(fmtKm(t.km), 'prijeđeno', 'km') : '',
    elev: hasElev ? stat(Math.round(t.elev).toLocaleString('hr'), 'visinska razlika', 'm') : '',
    spd: moving.sec > 0 && moving.km > 0 ? stat((moving.km / (moving.sec / 3600)).toFixed(1).replace('.', ','), 'prosječna brzina', 'km/h') : '',
    pace: moving.sec > 0 && moving.km >= 1 ? stat(Math.floor(moving.sec / moving.km / 60) + ':' + String(Math.round(moving.sec / moving.km) % 60).padStart(2, '0'), 'prosječni tempo', 'min/km') : '',
    hr: hrs.length ? stat(Math.round(hrs.reduce((p, a) => p + a.avgHr, 0) / hrs.length), 'prosječni puls', 'bpm') : '',
    cal: t.cal > 0 ? stat(Math.round(t.cal).toLocaleString('hr'), 'kalorija', 'kcal') : ''
  };
  html += '<div class="grid">' + ovCfg(UI.sport).stats.map(k => cards[k] || '').join('') + '</div>';
  html += '<div class="card"><div class="metric">' + [['km', 'Kilometri', hasKm], ['h', 'Sati', true], ['n', 'Treninzi', true]].filter(x => x[2]).map(([k, l]) => '<button data-metric="' + k + '" class="' + (metric === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' + chart(bks, vals, unit) + '</div>';
  if (UI.period !== 'all' && !list.length) html += '<p class="empty">Nema treninga u ovom razdoblju.</p>';
  else if (list.length) html += '<div class="list" style="margin-top:6px"><div class="day">Treninzi u razdoblju</div>' + (UI.ovAll ? list.slice(0, UI.limit) : list.slice(0, 8)).map(item).join('') + (UI.ovAll ? (list.length > UI.limit ? '<button class="btn" style="width:100%" id="more">Prikaži još (' + (list.length - UI.limit) + ')</button>' : '') : list.length > 8 ? '<button class="btn" style="width:100%" data-ovall="1">Prikaži svih ' + list.length + '</button>' : '') + '</div>';
  return html;
}
const hoursStr = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + '<small>h</small> ' + String(m).padStart(2, '0') + '<small>min</small>'; };

function chart(bks, vals, unit) {
  if (!bks.length) return '<p class="empty">Nema podataka.</p>';
  const n = bks.length, vert = n > 14, W = 340, H = 150, padL = 4, padB = 18, padT = vert ? 30 : 14;
  const fmtV = v => unit === '×' ? String(v) : (v >= 10 ? String(Math.round(v)) : v.toFixed(1).replace('.', ','));
  const max = Math.max(...vals, 0.0001), bw = (W - padL * 2) / n, gap = Math.min(4, bw * 0.25);
  const every = n > 20 ? 5 : n > 12 ? 2 : 1;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Graf">';
  s += '<line x1="0" x2="' + W + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '" stroke="var(--line)"/>';
  vals.forEach((v, i) => {
    const h = v > 0 ? Math.max(2, (v / max) * (H - padB - padT)) : 0;
    const x = padL + i * bw + gap / 2, y = H - padB - h;
    const col = UI.sport === 'all' ? 'var(--accent)' : typeColor(UI.sport);

const prog = {
  open(t) { $('#progTxt').textContent = t; const b = $('#progBar'); b.removeAttribute('value'); if (!$('#prog').open) $('#prog').showModal(); },
  set(t, v, m) { $('#progTxt').textContent = t; const b = $('#progBar'); b.max = m; b.value = v; },
  close() { if ($('#prog').open) $('#prog').close(); }
};
$('#prog').addEventListener('cancel', e => e.preventDefault());
const tick = () => new Promise(r => setTimeout(r, 0));
const r1 = (v, d) => v === null || v === undefined ? null : Math.round(v * Math.pow(10, d)) / Math.pow(10, d);

async function saveZones() {
  const n = { hr: [], spd: [], walk: [] };
  document.querySelectorAll('.zset input').forEach(i => { n[i.dataset.z][+i.dataset.i] = +String(i.value).replace(',', '.'); });
  const ok = Analytics.cfgFrom(n), same = k => ok[k].every((v, i) => v === n[k][i]);
  if (!same('hr') || !same('spd') || !same('walk')) { toast('Granice moraju biti brojevi koji rastu: Z2 < Z3 < Z4 < Z5.', 3600); render(); return; }
  DB.settings = Object.assign({}, DB.settings, { updated: Date.now(), hr: n.hr, spd: n.spd, walk: n.walk });
  await persist(); toast('Zone spremljene.');
}
async function attachTrack(id, track) {
  await store.setTrack(id, track);
  DB.activities[id].hasTrack = true;
  DB.activities[id].updated = Date.now(); // da se oznaka rute prenese i na druge uređaje pri sinkronizaciji
  META.tracksDirty = true;
}
function showReport(title, lines, fails) {
  const dlg = $('#dlg'); dlg.onclose = null;
  dlg.innerHTML = '<h2>' + esc(title) + '</h2><div style="margin-top:8px">' + lines.map(l => '<p style="margin:4px 0">' + esc(l) + '</p>').join('') + '</div>' +
    (fails.length ? '<label>Nije uspjelo (' + fails.length + ')</label><textarea readonly style="min-height:120px;font:12px monospace">' + esc(fails.slice(0, 40).join('\n')) + '</textarea>' : '') +
    '<div class="acts"><div></div><button class="btn pri" id="ok">U redu</button></div>';
  dlg.showModal(); $('#ok').onclick = () => dlg.close();
}

async function importCsvText(text) {
  const { activities, bad } = Core.importStravaCSV(text);
  const r = Core.addImported(DB, activities);
  await persist(r.added > 0 || r.filled > 0);
  UI.view = 'overview'; render();
  showReport('Uvoz završen', ['Treninga: ' + r.added + ' novih, ' + r.dup + ' već postoji' + (r.filled ? ' (' + r.filled + ' dopunjeno opisima i oznakama)' : '') + (bad.length ? ', ' + bad.length + ' redaka preskočeno' : '') + '.',
    'Za rute i grafove uvezi cijeli ZIP ili dodaj GPS datoteke.'], []);
}

async function importExport(file) {
  const nm = file.name.toLowerCase();
  if (nm.endsWith('.csv')) return importCsvText(await file.text());
  if (!nm.endsWith('.zip')) throw new Error('Odaberi ZIP iz Strave ili datoteku activities.csv.');
  prog.open('Čitam ZIP…');
  const zip = await Files.readZip(file);
  const ce = zip.entries.get('activities.csv') || [...zip.entries.values()].find(e => /(^|\/)activities\.csv$/i.test(e.name));
  if (!ce) throw new Error('U ZIP-u nema datoteke activities.csv.');
  const { activities, bad } = Core.importStravaCSV(Files.decodeText(await zip.read(ce)));
  const r = Core.addImported(DB, activities);
  await persist(r.added > 0 || r.filled > 0);
  const byBase = new Map();
  for (const e of zip.entries.values()) byBase.set(Files.baseName(e.name), e);
  const withFile = Object.values(DB.activities).filter(a => a.file);
  const had = withFile.filter(a => a.hasTrack).length;
  const todo = [], missing = [];
  for (const a of withFile) {
    if (a.hasTrack) continue;
    const en = zip.entries.get(a.file) || byBase.get(Files.baseName(a.file));
    (en ? todo : missing).push([a, en]);
  }
  let okN = 0; const fails = [];
  for (let i = 0; i < todo.length; i++) {
    const [a, en] = todo[i];
    prog.set('Rute: ' + (i + 1) + ' od ' + todo.length, i, todo.length);
    try {
      const bt = Files.buildTrack(await Files.parseActivityFile(en.name, await zip.read(en)));
      await attachTrack(a.id, bt.track); okN++;
    } catch (e) { fails.push(Files.baseName(en.name) + ' (' + (a.name || a.id) + '): ' + (e.message || e)); }
    if (i % 15 === 14) { await store.set('db', DB); await store.set('meta', META); await tick(); }
  }
  prog.close();
  await persist(true);
  UI.view = 'overview'; render();
  const lines = ['Treninga: ' + r.added + ' novih, ' + r.dup + ' već postoji' + (r.filled ? ' (' + r.filled + ' dopunjeno opisima i oznakama)' : '') + (bad.length ? ', ' + bad.length + ' redaka preskočeno' : '') + '.',
    'Rute: ' + okN + ' dodano' + (had ? ', ' + had + ' ih je već imalo rutu' : '') + '.'];
  if (missing.length) lines.push(missing.length + ' treninga u CSV-u navodi datoteku koje nema u ZIP-u.');
  showReport('Uvoz završen', lines, fails);
}

async function importGpsFiles(files) {
  prog.open('Čitam datoteke…');
  const byBase = new Map(Object.values(DB.activities).filter(a => a.file).map(a => [Files.stripGz(Files.baseName(a.file)).toLowerCase(), a]));
  let matched = 0, created = 0, skipped = 0; const fails = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    prog.set('Datoteka ' + (i + 1) + ' od ' + files.length, i, files.length);
    try {
      const bt = Files.buildTrack(await Files.parseActivityFile(f.name, new Uint8Array(await f.arrayBuffer())));
      const st = bt.stats;
      let a = byBase.get(Files.stripGz(f.name).toLowerCase());
      if (!a && st.start) { const t = Date.parse(st.start); a = Object.values(DB.activities).find(x => Math.abs(Date.parse(x.date) - t) < 10 * 60 * 1000); }
      if (a) {
        if (a.hasTrack) { skipped++; continue; }
        await attachTrack(a.id, bt.track); matched++;
      } else {
        const type = bt.sport || Files.guessType(st), date = st.start || new Date(f.lastModified).toISOString();
        const id = 'f' + Math.round(Date.parse(date) / 1000);
        delete DB.deleted[id];
        DB.activities[id] = {
          id, date, name: bt.name || typeLabel(type), type, desc: '', dist: r1(st.dist, 3) || 0, elapsed: st.elapsed, moving: st.moving,
          avgSpeed: r1(st.avgSpeed, 2), elev: st.elev != null ? Math.round(st.elev) : null, avgHr: r1(st.avgHr, 0), maxHr: st.maxHr, watts: r1(st.watts, 0), cal: st.cal,
          gear: '', effort: null, lifted: null, sets: null, reps: null, file: f.name, notes: '', tags: [], src: 'file', updated: Date.now()
        };
        await attachTrack(id, bt.track); created++;
      }
    } catch (e) { fails.push(f.name + ': ' + (e.message || e)); }
  }
  prog.close();
  await persist(true); render();
  const lines = [];
  if (matched) lines.push(matched + ' ruta dodano postojećim treninzima.');
  if (created) lines.push(created + ' novih treninga napravljeno iz datoteka (provjeri sport i naziv).');
  if (skipped) lines.push(skipped + ' već ima rutu (preskočeno).');
  if (!lines.length && !fails.length) lines.push('Ništa za uvesti.');
  showReport('Uvoz GPS datoteka', lines, fails);
}

$('#csvIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;

  const cfg = zoneCfg(type), L = zoneLabels(type), z = Analytics.zonesFor(tr, cfg); if (!z) return;
  let h = '';
  if (z.hr) h += '<h3 class="zh">Zone pulsa</h3>' + zoneBars(z.hr, L.hr) + (Analytics.verdict(z) ? '<p style="margin:8px 0 0"><b>' + esc(Analytics.verdict(z)) + '</b></p>' : '');
  if (z.spd) h += '<h3 class="zh">Zone brzine' + (Analytics.group(type) === 'walk' ? ' (hodanje)' : '') + '</h3>' + zoneBars(z.spd, L.spd);
  box.innerHTML = h;
}
const paceStr = a => { if (!(a.dist > 0) || !(a.moving || a.elapsed)) return null; const s = Math.round((a.moving || a.elapsed) / a.dist); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- karta svih ruta ---------- */
const MAPD = { routes: null, sig: '', busy: false, on: { ride: true, commute: true }, str: 2, gray: true, year: 'all', map: null };
const HM_COL = { ride: '#e0430c', commute: '#2f6fd0' };
const HM_STR = { 1: [0.16, 2], 2: [0.26, 3], 3: [0.42, 4] };   // [prozirnost, debljina] po jačini

async function loadMapData() {
  const rs = acts().filter(a => a.hasTrack), sig = rs.map(a => a.id).join(',');
  if (MAPD.busy || (MAPD.routes && MAPD.sig === sig)) return;
  MAPD.busy = true; const out = [];
  try {
    for (let i = 0; i < rs.length; i++) {
      const tr = await store.get('tr:' + rs[i].id);
      if (tr && tr.poly) { const ll = Files.decPoly(tr.poly); if (ll.length >= 2) out.push({ id: rs[i].id, ll, commute: !!rs[i].commute, type: rs[i].type, year: new Date(rs[i].date).getFullYear() }); }
      if (i % 20 === 19) { const n = $('#hmNote'); if (n) n.textContent = 'Učitavam rute… ' + (i + 1) + '/' + rs.length; await tick(); }
    }
  } catch (e) { /* prikaži što je učitano */ }
  MAPD.routes = out; MAPD.sig = sig; MAPD.busy = false;
  if (UI.view === 'map') render();
}
function mapRoutes() { return (MAPD.routes || []).filter(r => /ride/i.test(r.type) && !/virtual/i.test(r.type) && (MAPD.year === 'all' || String(r.year) === MAPD.year)); }
function mapSpec() {
  const R = mapRoutes(), [alpha, width] = HM_STR[MAPD.str];
  return [{ key: 'ride', name: 'Vožnje', routes: R.filter(r => !r.commute) }, { key: 'commute', name: 'Commute', routes: R.filter(r => r.commute) }]
    .map(L => Object.assign(L, { color: HM_COL[L.key], alpha, width, all: L.routes, routes: MAPD.on[L.key] ? L.routes : [] }));
}
function viewMap() {
  if (!acts().some(a => a.hasTrack)) return '<p class="empty">Za kartu su potrebne GPS rute. Uvezi Strava ZIP u Postavkama.</p>';
  loadMapData();
  const years = [...new Set((MAPD.routes || []).map(r => r.year))].sort((x, y) => y - x);
  const ch = (attr, val, on, label) => '<button class="chip ' + (on ? 'on' : '') + '" ' + attr + '="' + val + '">' + label + '</button>';
  const lay = (k, label) => '<button class="chip lay ' + (MAPD.on[k] ? 'on' : '') + '" data-mt="' + k + '"><i style="background:' + HM_COL[k] + '"></i>' + label + ' <span id="n_' + k + '"></span></button>';
  return (years.length > 1 ? '<div class="chips">' + ch('data-myear', 'all', MAPD.year === 'all', 'Sve godine') + years.map(y => ch('data-myear', y, MAPD.year === String(y), y)).join('') + '</div>' : '') +
    '<div class="chips wrap">' + lay('ride', 'Vožnje') + lay('commute', 'Commute') + '<button class="chip ' + (MAPD.gray ? 'on' : '') + '" data-mt="gray">Siva podloga</button></div>' +
    '<div class="chips wrap"><span class="note" style="margin:0;align-self:center">Jačina:</span>' + [[1, 'Tanko'], [2, 'Srednje'], [3, 'Jako']].map(([k, l]) => '<button class="chip ' + (MAPD.str === k ? 'on' : '') + '" data-mt="str' + k + '">' + l + '</button>').join('') + '</div>' +
    '<div class="hm-wrap"><div id="hmBox" class="hm"></div></div><p class="note" id="hmNote">' + (MAPD.routes ? '' : 'Učitavam rute…') + '</p>';
}
function mountMap() {
  const box = $('#hmBox'); if (!box) return;
  destroyMap();
  MAPD.map = TrackView.HeatMap(box); MAPD.map.setGray(MAPD.gray);
  if (MAPD.routes) applyMap(true);
}
function destroyMap() { if (MAPD.map) { MAPD.map.destroy(); MAPD.map = null; } }
function applyMap(refit) {
  if (!MAPD.map) return;
  const spec = mapSpec();
  MAPD.map.setData(spec, refit);
  spec.forEach(L => { const n = $('#n_' + L.key); if (n) n.textContent = '(' + L.all.length + ')'; });
  const note = $('#hmNote'); if (note) note.textContent = !MAPD.routes.length ? 'Nema ruta za prikaz.' : spec.every(L => !L.routes.length) ? 'Ništa nije uključeno ili nema ruta za odabrani filtar.' : '';
}
function mapToggle(b) {
  const k = b.dataset.mt;
  if (k === 'gray') { MAPD.gray = !MAPD.gray; b.classList.toggle('on', MAPD.gray); if (MAPD.map) MAPD.map.setGray(MAPD.gray); return; }
  if (k.startsWith('str')) { MAPD.str = +k.slice(3); document.querySelectorAll('[data-mt^=str]').forEach(x => x.classList.toggle('on', x === b)); applyMap(false); return; }
  MAPD.on[k] = !MAPD.on[k]; b.classList.toggle('on', MAPD.on[k]); applyMap(false);
}

/* ---------- pokretanje ---------- */
(async function init() {
  const d = await store.get('db'); if (d && d.activities) { DB = d; DB.gear = DB.gear || {}; DB.settings = DB.settings || {}; }
  const m = await store.get('meta'); if (m) META = Object.assign(META, m);
  try { const t = JSON.parse(sessionStorage.getItem('tok')); if (t && Date.now() < t.tokenExp - 60000) { token = t.token; tokenExp = t.tokenExp; } } catch (_) {}
  render(); renderSync();
  if (clientId() && token && META.lastSync) sync(false); // tiha sinkronizacija ako je prijava još valjana
  if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (clientId()) { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onerror = () => {}; document.head.appendChild(s); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
